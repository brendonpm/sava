<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Privacy policy — Sava</title>
  <meta name="description" content="Privacy policy of the Sava Chrome extension. EN · PT · ES · FR · DE · JA">
  <link rel="icon" href="icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- O texto vem de privacy-i18n.js (?lang=en|pt|es|fr|de|ja, ou o idioma do navegador). -->
  <header class="top">
    <div class="wrap">
      <a class="brand" href="index.html" id="home"><img src="icon.png" alt="" width="32" height="32">Sava</a>
      <nav aria-label="Sections"><a class="nav-cta" href="index.html#instalar" id="install-link">Install</a></nav>
      <label class="lang-pick"><span class="sr-only">Language</span><span aria-hidden="true">🌐</span><select id="lang"></select></label>
    </div>
  </header>

  <main class="doc">
    <h1 id="h1">Privacy policy</h1>
    <p class="updated" id="updated"></p>
    <div id="body"></div>
    <p id="contact-line"></p>
  </main>

  <footer>
    <div class="wrap"><span>Sava · <span id="indep">independent project</span></span><a href="index.html" id="back">Back to home</a></div>
  </footer>
  <script src="config.js"></script>
  <script src="privacy-i18n.js"></script>
  <script>
    (() => {
      const ALL = window.PRIVACY_I18N;
      const NAMES = { en: 'English', pt: 'Português', es: 'Español', fr: 'Français', de: 'Deutsch', ja: '日本語' };
      const q = new URLSearchParams(location.search).get('lang');
      let lang = q && ALL[q] ? q : null;
      if (!lang) { try { const s = localStorage.getItem('sava-lang'); if (s && ALL[s]) lang = s; } catch (_) {} }
      if (!lang) for (const l of navigator.languages || [navigator.language]) { const b = String(l).toLowerCase().split('-')[0]; if (ALL[b]) { lang = b; break; } }
      lang = lang || 'en';
      const P = ALL[lang];
      document.documentElement.lang = lang;
      document.title = P.title;
      document.getElementById('h1').textContent = P.h1;
      document.getElementById('updated').textContent = P.updated;
      document.getElementById('body').innerHTML = P.body; // texto do próprio site
      document.getElementById('install-link').textContent = P.install;
      document.getElementById('back').textContent = P.back;
      document.getElementById('indep').textContent = P.indep;
      for (const id of ['home', 'back']) document.getElementById(id).href = 'index.html?lang=' + lang;
      document.getElementById('install-link').href = 'index.html?lang=' + lang + '#instalar';
      const c = (window.SAVA_CONFIG || {}).contact;
      const line = document.getElementById('contact-line');
      if (c) {
        const a = document.createElement('a');
        a.href = c.includes('@') && !c.startsWith('http') ? 'mailto:' + c : c;
        a.textContent = c;
        line.append(P.contact_pre, a, '.');
      } else line.textContent = P.contact_none;
      const sel = document.getElementById('lang');
      for (const l of Object.keys(ALL)) sel.add(new Option(NAMES[l], l, false, l === lang));
      sel.addEventListener('change', () => {
        try { localStorage.setItem('sava-lang', sel.value); } catch (_) {}
        location.search = '?lang=' + sel.value;
      });
    })();
  </script>
</body>
</html>
