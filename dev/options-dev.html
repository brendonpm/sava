<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Opções (dev)</title>
<base href="/src/options/">
<link rel="stylesheet" href="options.css">
<script>
  // Carrega a página de opções real fora da extensão, com chrome.* simulado.
  const mem = {};
  const area = { get: async (k) => (typeof k === 'string' ? { [k]: mem[k] } : { ...mem }), set: async (o) => Object.assign(mem, o) };
  window.chrome = { runtime: { getURL: (p) => '/' + p, sendMessage() {} }, storage: { sync: area, local: area, onChanged: { addListener() {} } } };
  addEventListener('DOMContentLoaded', async () => {
    const html = await (await fetch('options.html')).text();
    const doc = new DOMParser().parseFromString(html, 'text/html');
    const scripts = [...doc.querySelectorAll('script')].map((s) => s.getAttribute('src'));
    doc.querySelectorAll('script').forEach((s) => s.remove());
    document.body.innerHTML = doc.body.innerHTML;
    for (const src of scripts) await new Promise((ok) => { const s = document.createElement('script'); s.src = src; s.onload = ok; document.body.append(s); });
  });
</script>
</head>
<body></body>
</html>
